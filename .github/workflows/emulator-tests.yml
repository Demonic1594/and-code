name: Emulator tests

# Boots an Android emulator on a hosted runner (they expose KVM) and runs the app's device
# tests (app/src/androidTest) plus a smoke pass: install, launch, screenshots and a short
# monkey run to shake out crashes. Started by hand only, so it never adds a run per push.
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: Android API level of the emulator image
        required: true
        default: '34'
      monkey-events:
        description: Random UI events for the crash-hunting monkey pass (0 to skip)
        required: true
        default: '1500'

permissions:
  contents: read

concurrency:
  group: emulator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Built before the emulator boots, so the emulator's time is spent on tests only.
      # See release.yml for why this is AND_CODE_-prefixed rather than GITHUB_CLIENT_ID directly.
      - name: Build the app and its device tests
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}

      - name: Device tests and smoke pass on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
          MONKEY_EVENTS: ${{ inputs.monkey-events }}
        with:
          api-level: ${{ inputs.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/emulator-run.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results-api${{ inputs.api-level }}
          path: |
            emulator-artifacts/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
