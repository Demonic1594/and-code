name: Discord Notify

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, closed]
  release:
    types: [published]
  workflow_run:
    # GitHub rejects a workflow_run trigger that names no workflows, and then fails every run of
    # this file, which is what silenced all notifications from 2026-11-01 on.
    workflows: ["Android CI", "Release", "Native runtime source build", "Publish F-Droid repository", "i18n Check"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "test: post one test message. backfill: post the commits after `since`, up to `until`."
        type: choice
        options: [test, backfill]
        default: test
      since:
        description: "backfill: the last commit that was already posted (exclusive)"
        required: false
      until:
        description: "backfill: the last commit to post (inclusive)"
        required: false
        default: main

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Manual test message
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -eu
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret; skipping."; exit 0; fi
          payload=$(jq -n --arg repo "$GITHUB_REPOSITORY" \
            '{username: "and-code",
              embeds: [{title: "Discord notify is wired up",
                        description: "Manual test from \($repo).",
                        color: 7506394}]}')
          curl -sf --max-time 30 --retry 4 --retry-all-errors \
            -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d "$payload"

      - name: Check out the notifier
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill')
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Commits pushed
        if: github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.event.pusher.name || github.actor }}
          MODE: push
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret; skipping."; exit 0; fi
          python3 .github/scripts/discord_commits.py

      - name: Backfill commits that were not posted
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ inputs.since }}
          AFTER: ${{ inputs.until }}
          BRANCH: main
          MODE: backfill
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret; skipping."; exit 1; fi
          if [ -z "$BEFORE" ]; then echo "Set 'since' to the last commit already posted."; exit 1; fi
          python3 .github/scripts/discord_commits.py

      - name: Pull request events
        if: github.event_name == 'pull_request'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -eu
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret; skipping."; exit 0; fi
          event="$GITHUB_EVENT_PATH"

          action=$(jq -r .action "$event")
          merged=$(jq -r .pull_request.merged "$event")
          if [ "$action" = "closed" ] && [ "$merged" != "true" ]; then
            exit 0
          fi
          # A PR merged into main lands as a push to main, whose commit card links back to the PR.
          base_ref=$(jq -r .pull_request.base.ref "$event")
          if [ "$merged" = "true" ] && [ "$base_ref" = "main" ]; then
            echo "Merged into main; the commit card covers it."
            exit 0
          fi

          repo=$(jq -r .repository.full_name "$event")
          number=$(jq -r .pull_request.number "$event")
          title=$(jq -r .pull_request.title "$event")
          url=$(jq -r .pull_request.html_url "$event")
          author=$(jq -r .pull_request.user.login "$event")
          avatar=$(jq -r '.pull_request.user.avatar_url // ""' "$event")
          branch=$(jq -r .pull_request.head.ref "$event")
          base=$(jq -r .pull_request.base.ref "$event")
          draft=$(jq -r .pull_request.draft "$event")
          labels=$(jq -r '[.pull_request.labels[].name] | join(", ")' "$event")
          ts=$(jq -r '.pull_request.updated_at // ""' "$event")
          merged_by=$(jq -r '.pull_request.merged_by.login // ""' "$event")
          adds=$(jq -r '.pull_request.additions // 0' "$event")
          dels=$(jq -r '.pull_request.deletions // 0' "$event")
          files=$(jq -r '.pull_request.changed_files // 0' "$event")

          label="opened"
          color=3066993
          if [ "$merged" = "true" ]; then
            label="merged"
            color=10181046
          elif [ "$action" = "reopened" ]; then
            label="reopened"
          fi
          if [ "$draft" = "true" ]; then
            label="$label · draft"
          fi

          footer="$repo"
          if [ "$merged_by" != "" ]; then
            footer="$repo · merged by @$merged_by"
          fi

          desc="by @$author · \`$base\` → \`$branch\`"
          if [ "$labels" != "" ]; then
            desc="$desc"$'\n'"Labels: $labels"
          fi

          payload=$(jq -n \
            --arg title "PR #$number $label: $title" \
            --arg author "$author" \
            --arg avatar "$avatar" \
            --arg ts "$ts" \
            --arg desc "$desc" \
            --arg url "$url" \
            --arg footer "$footer" \
            --argjson color "$color" \
            --argjson adds "$adds" --argjson dels "$dels" --argjson files "$files" \
            '{username: "and-code",
              embeds: [{
                title: ($title | .[0:250]), url: $url,
                description: ($desc | .[0:4000]), color: $color,
                author: {name: ("@" + $author)} + (if $avatar != "" then {icon_url: $avatar} else {} end)
              }
              + (if $ts != "" then {timestamp: $ts} else {} end)
              + {fields: [
                  {name: "Lines", value: "+\($adds) / −\($dels)", inline: true},
                  {name: "Files", value: "\($files)", inline: true}
                ]}
              + {footer: {text: ($footer | .[0:200])}}]}')

          curl -sf --max-time 30 --retry 4 --retry-all-errors \
            -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d "$payload"

      - name: Release published
        if: github.event_name == 'release'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -eu
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret; skipping."; exit 0; fi
          event="$GITHUB_EVENT_PATH"

          tag=$(jq -r '.release.tag_name // "release"' "$event")
          name=$(jq -r '.release.name // ""' "$event")
          url=$(jq -r '.release.html_url // ""' "$event")
          prerelease=$(jq -r '.release.prerelease // false' "$event")
          assets=$(jq -r '.release.assets | length // 0' "$event")
          ts=$(jq -r '.release.published_at // ""' "$event")
          author=$(jq -r '.sender.login // "unknown"' "$event")
          avatar=$(jq -r '.sender.avatar_url // ""' "$event")
          body=$(jq -r '.release.body // "" | .[0:3000]' "$event")

          title="Release $tag"
          if [ "$name" != "" ] && [ "$name" != "$tag" ]; then
            title="Release $tag: $name"
          fi
          if [ "$prerelease" = "true" ]; then
            title="$title (pre-release)"
          fi

          payload=$(jq -n \
            --arg title "$title" \
            --arg author "$author" \
            --arg avatar "$avatar" \
            --arg ts "$ts" \
            --arg desc "$body" \
            --arg url "$url" \
            --argjson assets "$assets" \
            --argjson pre "$prerelease" \
            '{username: "and-code",
              embeds: [{
                title: ($title | .[0:250]), url: $url, color: 16098851,
                description: (if $desc == "" then " " else ($desc | .[0:3900]) end),
                author: {name: ("@" + $author)} + (if $avatar != "" then {icon_url: $avatar} else {} end)
              }
              + (if $ts != "" then {timestamp: $ts} else {} end)
              + {fields: [
                  {name: "Type", value: (if $pre then "pre-release" else "stable" end), inline: true},
                  {name: "Assets", value: "\($assets)", inline: true}
                ]}]}')

          curl -sf --max-time 30 --retry 4 --retry-all-errors \
            -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d "$payload"

      - name: CI failed on main
        if: github.event_name == 'workflow_run'
          && (github.event.workflow_run.conclusion == 'failure'
              || github.event.workflow_run.conclusion == 'timed_out')
          && github.event.workflow_run.head_branch == 'main'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -eu
          if [ -z "$WEBHOOK" ]; then echo "No webhook secret; skipping."; exit 0; fi
          event="$GITHUB_EVENT_PATH"

          wf=$(jq -r '.workflow_run.name // "workflow"' "$event")
          url=$(jq -r '.workflow_run.html_url // ""' "$event")
          branch=$(jq -r '.workflow_run.head_branch // "main"' "$event")
          sha=$(jq -r '.workflow_run.head_sha // ""' "$event")
          ts=$(jq -r '.workflow_run.updated_at // ""' "$event")
          msg=$(jq -r '.workflow_run.head_commit.message // ""' "$event" | head -1)

          sha7=${sha:0:7}
          desc="on \`$branch\`"
          if [ "$sha7" != "" ]; then
            desc="on \`$branch\` · \`$sha7\`"
          fi
          if [ "$msg" != "" ]; then
            desc="$desc"$'\n'"$msg"
          fi

          payload=$(jq -n \
            --arg title "CI failed: $wf" \
            --arg desc "$desc" \
            --arg url "$url" \
            --arg ts "$ts" \
            '{username: "and-code",
              embeds: [{
                title: ($title | .[0:250]), url: $url,
                description: ($desc | .[0:4000]), color: 15158332
              }
              + (if $ts != "" then {timestamp: $ts} else {} end)]}')

          curl -sf --max-time 30 --retry 4 --retry-all-errors \
            -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d "$payload"
