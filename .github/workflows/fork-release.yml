name: Fork release

# Publishes the "AndCode LH" debug-signed APK as a GitHub release, for a fork that has no release
# signing secrets. The signed upstream flow lives in release.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (defaults to .release-version, e.g. v1.2.28)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # No SDK setup: the hosted runner already ships the platform and build-tools Android CI
      # builds with. android-actions/setup-android@v3 installs the removed legacy "tools" package
      # and fails before Gradle starts.
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$(tr -d '[:space:]' < .release-version)}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Tag '$TAG' is not of the form vX.Y.Z" >&2
            exit 1
          fi
          if ! grep -qF "versionName = \"${TAG#v}\"" app/build.gradle.kts; then
            echo "Tag $TAG does not match versionName in app/build.gradle.kts" >&2
            exit 1
          fi
          # A tag that already exists must point at the commit being built, or the APK would be
          # attached to a release of different code.
          EXISTING="$(git ls-remote --tags origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | tail -1 | cut -f1)"
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "${{ github.sha }}" ]; then
            echo "Tag $TAG already exists at $EXISTING, not at ${{ github.sha }}" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build the debug APK
        run: ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubDebug
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
      - name: Create the release and upload the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          cp app/build/outputs/apk/github/debug/app-github-debug.apk "and-code-lh-$TAG-debug.apk"
          sha256sum "and-code-lh-$TAG-debug.apk" > "and-code-lh-$TAG-debug.apk.sha256"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              cat "fastlane/metadata/android/en-US/changelogs/$CODE.txt"
              printf '\n**Install:** download `and-code-lh-%s-debug.apk`. It installs as **AndCode LH** (`com.yugahashimoto.andcode.heap`) beside an upstream AndCode, with its own data and local runtime port. It is debug-signed, so it updates only other builds signed the same way. SHA-256 is in the `.sha256` file.\n\n' "$TAG"
            } > notes.md
            gh release create "$TAG" --target "${{ github.sha }}" --title "AndCode LH $TAG" \
              --notes-file notes.md --generate-notes --latest
          fi
          gh release upload "$TAG" --clobber "and-code-lh-$TAG-debug.apk" "and-code-lh-$TAG-debug.apk.sha256"
